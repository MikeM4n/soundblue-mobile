<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SoundBlue</title>
    <meta name="description" content="SoundBlue: tu música, sin suscripción. Catálogo de YouTube Music, sin rastreadores. Funciona mejor con Brave." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Tema antes de pintar nada (Ajustes → Tema; por defecto, oscuro): sin destello al cargar.
      // Lo mismo hace src/lib/theme.ts cuando la app ya está abierta.
      try {
        var tema = JSON.parse(localStorage.getItem('soundblue:ajustes') || '{}').theme || 'oscuro'
        if (tema === 'sistema') tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        document.documentElement.dataset.tema = tema
        if (tema === 'claro') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff')
      } catch (e) {}
    </script>
    <!-- Pantalla de carga: aparece al instante (antes de que cargue la app); src/lib/splash.ts la desvanece. -->
    <style>
      /* El mismo negro del manifiesto (background_color) desde el primer instante: sin destellos entre la pantalla de
         arranque del sistema y esta animación. */
      html,
      body {
        margin: 0;
        background: #000;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        transition: opacity 450ms ease;
        /* Tope de 2 s: si src/lib/splash.ts no la quitó antes (la interfaz tarda), se desvanece sola. */
        animation: splash-tope 450ms ease 1550ms forwards;
      }
      @keyframes splash-tope {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      #splash.splash-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 96px;
        height: 96px;
      }
      #splash p {
        margin: 0;
        color: #fff;
        font: 700 28px / 1 'Inter Variable', system-ui, sans-serif;
        letter-spacing: -0.02em;
        opacity: 0;
        animation: splash-fade 900ms ease 250ms forwards;
      }
      /* Tema claro: fondo blanco desde el primer instante (el logo azul se ve igual). */
      html[data-tema='claro'],
      html[data-tema='claro'] body,
      html[data-tema='claro'] #splash {
        background: #fff;
      }
      html[data-tema='claro'] #splash p {
        color: #111;
      }
      @keyframes splash-fade {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash p {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>

        </path>
      </svg>
      <p>SoundBlue</p>
    </div>
    <script>
      // Con «reducir movimiento» del teléfono, la onda se queda quieta (la animación SVG no se detiene con CSS).
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelector('#splash svg').pauseAnimations()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
