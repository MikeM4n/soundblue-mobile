apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose' // el widget (Jetpack Glance) se escribe con Compose

// Versión de la app: la de package.json (la misma que muestra Ajustes). 1.2.3 → versionCode 10203.
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def appVersionParts = appVersion.tokenize('.').collect { it.toInteger() }

// Firma de producción: la clave y su contraseña van en android/keystore.properties (storeFile, storePassword, keyAlias,
// keyPassword), que nunca se sube a git. Es la misma clave de siempre: las actualizaciones se instalan encima.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace = "com.soundblue.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.soundblue.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionParts[0] * 10000 + appVersionParts[1] * 100 + appVersionParts[2]
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
    buildFeatures {
        compose true
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }
    buildTypes {
        // El APK que se publica (npm run apk): no se puede depurar ni leer sus datos por USB.
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // El APK sale como SoundBlue.apk (no app-debug.apk): es el nombre con el que se publica en GitHub (version.json).
    applicationVariants.all { variant ->
        variant.outputs.all { outputFileName = 'SoundBlue.apk' }
    }
}

// Java compila para 21 (capacitor.build.gradle): Kotlin, igual.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-session:1.9.0'
    implementation 'androidx.glance:glance-appwidget:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
