// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Kotlin solo para el widget (Jetpack Glance es Compose); el resto del código nativo es Java. 2.2.x: la que entiende
    // el D8 de AGP 8.13 (con 2.3 avisa que no puede reescribir los metadatos de Kotlin).
    ext.kotlinVersion = '2.2.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
