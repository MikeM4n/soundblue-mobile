# Publica SoundBlue en GitHub Pages cada vez que subes cambios a la rama main.
# Resultado: https://mikem4n.github.io/soundblue/ (el repositorio debe llamarse «soundblue», igual que `base` en vite.config.ts).
# En GitHub: Settings → Pages → Source: «GitHub Actions».
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # La clave de YouTube nunca va en el código: sale del secreto del repositorio.
          VITE_YT_API_KEY: ${{ secrets.VITE_YT_API_KEY }}
          # Direcciones de los intermediarios (no son secretas: variables del repositorio, Settings → Secrets and
          # variables → Actions → Variables). Vacías, la app usa el respaldo (la lista de prueba).
          VITE_YTM_PROXY: ${{ vars.VITE_YTM_PROXY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v5
